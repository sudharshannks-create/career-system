<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NextStep AI - AI Career Recommendation System</title>

  <meta
    name="description"
    content="NextStep AI is an AI-powered career guidance platform for college students and job seekers. Get personalized career recommendations, skill gap analysis, and learning roadmaps."
  />

  <!-- ============================= -->
  <!-- Google Fonts -->
  <!-- ============================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- ============================= -->
  <!-- Lucide Icons -->
  <!-- ============================= -->

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- ============================= -->
  <!-- Chart.js -->
  <!-- ============================= -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ============================= -->
  <!-- Main CSS -->
  <!-- ============================= -->

  <link rel="stylesheet" href="css/main.css" />

  <!-- ============================= -->
  <!-- ============================= -->
  <!-- Environment Configuration     -->
  <!-- ============================= -->
  <script src="js/env.js"></script>
  <script type="module">
    // Vite environment variable bridge
    try {
      if (typeof import.meta !== 'undefined' && import.meta && import.meta.env) {
        if (import.meta.env.VITE_GOOGLE_CLIENT_ID) {
          window.VITE_GOOGLE_CLIENT_ID = import.meta.env.VITE_GOOGLE_CLIENT_ID;
          if (window.ENV) window.ENV.VITE_GOOGLE_CLIENT_ID = import.meta.env.VITE_GOOGLE_CLIENT_ID;
        }
      }
    } catch (e) {}
  </script>

  <!-- ============================= -->
  <!-- Google Identity Services      -->
  <!-- ============================= -->

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="window.__gsiLoaded = true; if (window.GoogleAuth && window.GoogleAuth.onGsiLoaded) window.GoogleAuth.onGsiLoaded();"
  ></script>

  <!-- ============================= -->
  <!-- SheetJS - Excel Export -->
  <!-- ============================= -->

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</head>

<body>

  <!-- ============================= -->
  <!-- Main Application -->
  <!-- ============================= -->

  <div id="app">

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Page Container -->
    <div id="page-container"></div>

  </div>


  <!-- ============================= -->
  <!-- Core JavaScript Files -->
  <!-- ============================= -->

  <script src="js/data.js"></script>

  <script src="js/sheets-db.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/google-auth.js"></script>

  <script src="js/router.js"></script>

  <script src="js/ui.js"></script>

  <script src="js/globals.js"></script>


  <!-- ============================= -->
  <!-- Pages Namespace -->
  <!-- ============================= -->

  <script>
    const Pages = {};
  </script>


  <!-- ============================= -->
  <!-- Page JavaScript Files -->
  <!-- ============================= -->

  <script src="js/pages/login.js"></script>

  <script src="js/pages/register.js"></script>

  <script src="js/pages/forgot-password.js"></script>

  <script src="js/pages/dashboard.js"></script>

  <script src="js/pages/career-setup.js"></script>

  <script src="js/pages/profile.js"></script>

  <script src="js/pages/assessment.js"></script>

  <script src="js/pages/careers.js"></script>

  <script src="js/pages/coach.js"></script>

  <script src="js/pages/interview.js"></script>

  <script src="js/pages/resume.js"></script>

  <script src="js/pages/portfolio.js"></script>

  <script src="js/pages/jobs.js"></script>

  <script src="js/pages/admin.js"></script>


  <!-- ============================= -->
  <!-- Excel -->
  <!-- ============================= -->

  <script src="js/excel.js"></script>


  <!-- ============================= -->
  <!-- Main Application -->
  <!-- ============================= -->

  <script src="js/app.js"></script>


  <!-- ============================= -->
  <!-- Initialize Lucide Icons -->
  <!-- ============================= -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof lucide !== "undefined") {
        lucide.createIcons();
      }
    });
  </script>

</body>
</html>
